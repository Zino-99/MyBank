name: CI MyBank

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : récupérer le code
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 2 : installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Étape 3 : installer les dépendances
      - name: Installation dépendances frontend
        run: npm ci
        working-directory: frontend

      # Étape 4 : build React/Vite
      - name: Build React
        run: npm run build
        working-directory: frontend

      # Étape 5 : lint ESLint
      - name: Lint ESLint
        run: npm run lint
        working-directory: frontend

      # Étape 6 : tests Vitest
      - name: Tests Vitest
        run: npm run test -- --reporter=verbose
        working-directory: frontend

  backend-tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mybank_test
          MYSQL_ROOT_PASSWORD: rootsecret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql

      - name: Installation dependances Composer
        run: composer install --no-interaction
        working-directory: backend

      - name: Migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
        working-directory: backend
        env:
          DATABASE_URL: 'mysql://root:rootsecret@127.0.0.1:3306/mybank_test'

      - name: Tests PHPUnit
        run: php bin/phpunit
        working-directory: backend
        env:
          DATABASE_URL: 'mysql://root:rootsecret@127.0.0.1:3306/mybank_test'!